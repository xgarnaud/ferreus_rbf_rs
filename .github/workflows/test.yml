name: Cargo test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  packages: read
  pull-requests: read
  checks: write

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        lfs: false
    - id: toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        components: clippy, rustfmt
        toolchain: stable
    - run: rustup override set ${{steps.toolchain.outputs.name}}
    - name: Rust cache
      uses: actions/cache@v6
      with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.toml', '**/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-stable-
    - name: Run clippy
      uses: clechasseur/rs-clippy-check@v5
      with:
        args: --all-targets --workspace
    - name: Rustfmt Check
      uses: actions-rust-lang/rustfmt@v1
    - name: Run cargo test
      uses: clechasseur/rs-cargo@v4
      with:
        command: test
    - name: Run cargo test --release
      uses: clechasseur/rs-cargo@v4
      with:
        command: test
        args: --release
    
  python:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        lfs: false
    - id: toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        components: clippy
        toolchain: stable
    - run: rustup override set ${{steps.toolchain.outputs.name}}
    - name: Rust cache
      uses: actions/cache@v6
      with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.toml', '**/rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-stable-
    - name: Run ruff
      run: |
        pip install ruff
        ruff check
        ruff format --check
    - name: Test 
      run: |
        cd py_ferreus_rbf
        pip install -e .
    #    python -m unittest discover
    - name: Run the examples
      run: |
        cd py_ferreus_rbf
        pip install -e .
        pip install pandas matplotlib
        python examples/boundary_closure.py
        python examples/franke_2d.py
        python examples/isosurface_linear.py
        python examples/isosurface_linear_rmt.py
        python examples/isosurface_linear_topo.py
        # python examples/isosurface_sphere.py
        python examples/isosurface_spheroidal_drift.py
        python examples/isosurface_spheroidal.py
        python examples/isosurface_trend_linear.py
